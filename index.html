<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e1116">
<title>No Homers Draft — Live</title>
<!--
  NO HOMERS LIVE DRAFT VIEWER  (DRAFT_LIVE_V1, 2026-07-26)

  Read-only. Polls the NAS every few seconds and redraws when the board changes.
  Nobody viewing this can put a pick on the board.

  Goes in the Watch101ltd/futures-game repo as index.html, so it serves from
  https://watch101ltd.github.io/futures-game/

  It carries NO player database and NO audio. The board publishes an already
  resolved snapshot (names, positions, teams, byes), so this page can never
  drift out of sync with the real board, and the draft chime stays on the
  Dude's own machine rather than on a public page.
-->
<style>
:root{
  --rb:#e8563f; --wr:#f2a63b; --qb:#56b4dd; --te:#a9d18e; --dst:#c9cdd1;
  --ink:#12151a; --paper:#0e1116; --panel:#161b22; --line:#2b323c;
  --dim:#8b95a3; --accent:#f0a63b; --good:#5fbf7f;
  --cellw:150px; --cellh:52px; --cellhk:40px; --scale:1;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  background:var(--paper); color:#e6ebf2;
  font:14px/1.35 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  display:flex; flex-direction:column; overflow:hidden;
}
#top{
  display:flex; align-items:center; gap:12px; padding:8px 13px;
  background:var(--panel); border-bottom:2px solid var(--accent); flex:0 0 auto;
}
#brand{font-weight:800; letter-spacing:.5px; font-size:15px; white-space:nowrap}
#brand span{color:var(--accent)}
#clock{flex:1 1 auto; display:flex; align-items:baseline; gap:10px; overflow:hidden; white-space:nowrap}
#clock .lbl{font-size:10px; font-weight:700; color:var(--dim); letter-spacing:1.4px}
#clock .rd{font-size:13px; color:#cfd8e3; font-weight:700}
#clock .who{font-size:18px; font-weight:800; color:var(--accent)}
/* Pick timer. The board sends a deadline, not a number, so this can tick
   smoothly between polls instead of jumping every few seconds. */
#timer{
  font-variant-numeric:tabular-nums; font-size:20px; font-weight:800; letter-spacing:.4px;
  padding:1px 9px; border-radius:6px; border:2px solid #3a4450;
  background:#10151b; color:#cfd8e3; white-space:nowrap; flex:0 0 auto;
}
#timer.warn{color:#ffd08a; border-color:#8a6a3d; background:#2a2216}
#timer.red { color:#ff9b8a; border-color:#8a4a3d; background:#2e1a16}
#timer.up  { color:#fff; background:#a3382a; border-color:#d1503c; font-size:17px;
             animation:flash 1s steps(1) infinite}
#timer.paused{color:#8b95a3}
@keyframes flash{0%{opacity:1}50%{opacity:.45}100%{opacity:1}}
#dot{
  font-size:10px; font-weight:800; letter-spacing:.4px; padding:5px 8px; border-radius:5px;
  border:1px solid var(--line); color:var(--dim); white-space:nowrap; flex:0 0 auto;
}
#dot.on{color:#bdf0d0; border-color:#3d8a59; background:#1b3527}
#dot.stale{color:#ffcf9b; border-color:#8a6a3d; background:#332818}
#dot.bad{color:#ffb4a6; border-color:#8a4a3d; background:#331e18}
.legend{display:flex; gap:7px; align-items:center; font-size:10px; color:var(--dim); flex:0 0 auto}
.legend i{display:inline-block; width:10px; height:10px; border-radius:2px; margin-right:3px; vertical-align:-1px}

#wrap{flex:1 1 auto; overflow:auto; padding:9px 12px 14px}
table.board{border-collapse:separate; border-spacing:3px; margin:0 auto}
th.corner{width:34px}
th.team{
  width:var(--cellw); background:#1d242d; border:1px solid var(--line);
  border-radius:5px; padding:5px 4px; vertical-align:middle;
}
th.team .tname{font-size:calc(14px * var(--scale)); font-weight:800; color:#fff; line-height:1.15}
th.team .tgrade{font-size:calc(11px * var(--scale)); font-weight:800; color:var(--accent); min-height:12px}
td.rd{
  width:34px; text-align:center; font-size:calc(15px * var(--scale)); font-weight:800;
  color:var(--dim); background:#141a21; border-radius:5px;
}
td.rd.rdk{color:#7c8796; font-size:calc(12px * var(--scale))}
td.cell{
  width:var(--cellw); height:var(--cellh);
  background:#12171e; border:1px dashed #2a313b; border-radius:5px;
  vertical-align:middle; position:relative;
}
td.cell.kcell{height:var(--cellhk)}
tr.krow td.cell{background:#0f141a; border-style:solid; border-color:#232b35}
tr.krow .stk{filter:saturate(.72) brightness(.93)}
tr.firstround td{box-shadow:0 -3px 0 -1px var(--accent)}
td.cell.onclock{border:2px solid var(--accent); background:#1d2129; box-shadow:0 0 0 2px rgba(240,166,59,.22)}
td.cell.xed{background:#0d1117; border-style:solid; border-color:#232a33}
td.cell.xed::after{
  content:""; position:absolute; inset:5px;
  background:
    linear-gradient(to top right, transparent calc(50% - 1px), #39424e 50%, transparent calc(50% + 1px)),
    linear-gradient(to bottom right, transparent calc(50% - 1px), #39424e 50%, transparent calc(50% + 1px));
}
.stk{
  height:100%; border-radius:4px; padding:3px 5px 2px; color:var(--ink);
  display:flex; flex-direction:column; justify-content:center; overflow:hidden;
  border:1px solid rgba(0,0,0,.22);
}
.stk .top{
  display:flex; align-items:baseline; justify-content:space-between; gap:6px;
  font-size:calc(14px * var(--scale)); font-weight:800; line-height:1.15;
  text-transform:uppercase; letter-spacing:.2px;
}
.stk .first{overflow:hidden; text-overflow:ellipsis; white-space:nowrap; min-width:0}
.stk .meta{flex:0 0 auto; white-space:nowrap; opacity:.95}
.stk .meta b{font-weight:900}
.stk .bye{opacity:.8}
.stk .kflag{
  flex:0 0 auto; font-size:calc(8.5px * var(--scale)); font-weight:900; letter-spacing:.6px;
  line-height:1.3; padding:0 calc(4px * var(--scale)); border-radius:3px;
  background:rgba(0,0,0,.32); color:rgba(255,255,255,.9); align-self:center;
}
.stk .last{
  font-size:calc(25px * var(--scale)); font-weight:800; line-height:1.05;
  text-transform:uppercase; letter-spacing:-.5px;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.stk .last.L10{font-size:calc(21px   * var(--scale)); letter-spacing:-.4px}
.stk .last.L12{font-size:calc(17.5px * var(--scale)); letter-spacing:-.3px}
.stk .last.L14{font-size:calc(15px   * var(--scale)); letter-spacing:-.2px}
.stk .last.L16{font-size:calc(13px   * var(--scale))}
.stk .last.L18{font-size:calc(11.5px * var(--scale))}
.stk.keeper{box-shadow:inset 0 0 0 2px rgba(0,0,0,.5)}
.stk.trade{
  background:repeating-linear-gradient(135deg,#ded8cc 0 9px,#d5cfc2 9px 18px);
  color:#2a2620; border:1px dashed #8d8578;
}
.stk.trade .first{opacity:.72; letter-spacing:.6px}
.pRB{background:var(--rb)} .pWR{background:var(--wr)} .pQB{background:var(--qb)}
.pTE{background:var(--te)} .pDST{background:var(--dst)} .pUNK{background:#9aa3ad}
/* a pick that just landed gets a brief glow, so a watcher sees WHAT changed */
@keyframes pop{0%{box-shadow:0 0 0 0 rgba(240,166,59,.85)}100%{box-shadow:0 0 0 9px rgba(240,166,59,0)}}
.stk.fresh{animation:pop 1.5s ease-out}
#msg{
  position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
  flex-direction:column; gap:11px; text-align:center; padding:26px; color:var(--dim);
}
#msg h2{color:#e6ebf2; font-size:19px}
#msg.hide{display:none}
#foot{
  flex:0 0 auto; padding:5px 13px 7px; font-size:10.5px; color:#5c6674;
  display:flex; justify-content:space-between; gap:12px; background:#11161d;
  border-top:1px solid var(--line);
}
</style>
</head>
<body>

<div id="top">
  <div id="brand">NO <span>HOMERS</span></div>
  <div id="clock">
    <span class="lbl">ON THE CLOCK</span>
    <span class="rd" id="cRd"></span>
    <span class="who" id="cWho">waiting…</span>
    <span id="timer" style="display:none"></span>
  </div>
  <div class="legend">
    <span><i style="background:var(--qb)"></i>QB</span>
    <span><i style="background:var(--rb)"></i>RB</span>
    <span><i style="background:var(--wr)"></i>WR</span>
    <span><i style="background:var(--te)"></i>TE</span>
    <span><i style="background:var(--dst)"></i>DEF</span>
  </div>
  <span id="dot">connecting…</span>
</div>

<div id="wrap"><div id="board"></div><div id="msg"><h2>Waiting for the draft</h2>
  <div>This page updates by itself. Leave it open, you do not need to refresh.</div></div></div>

<div id="foot">
  <span id="fLeft">Read-only view of the No Homers draft.</span>
  <span id="fRight"></span>
</div>

<script>
/* ============================================================
   Polls the NAS, redraws when the board changes. Read-only.
   ============================================================ */
const API      = 'https://nfl-nas.fantasywatch101.com';
const POLL_MS  = 4000;      // how often to look for a change
const SLOW_MS  = 15000;     // back off to this when the tab is hidden
const STALE_MS = 90000;     // no fresh publish for this long = say so

const $ = id => document.getElementById(id);
let lastHash = '', lastGood = 0, prevCells = {}, firstPaint = true, timer = null;
let tInfo = null;   // {ends:ISO} while running, or {paused:true,left:secs}

/* Ticks locally off the deadline the board sent, so it counts down smoothly
   rather than lurching once per poll. */
function paintTimer(){
  const el = $('timer');
  if(!tInfo){ el.style.display = 'none'; return; }
  el.style.display = '';
  let ms;
  if(tInfo.paused){
    ms = (tInfo.left || 0) * 1000;
    el.className = 'paused';
    el.textContent = fmt(ms) + ' ❚❚';
    return;
  }
  ms = Math.max(0, new Date(tInfo.ends).getTime() - Date.now());
  if(ms <= 0){ el.className = 'up'; el.textContent = "TIME'S UP"; return; }
  const s = Math.ceil(ms/1000);
  el.className = s <= 10 ? 'red' : (s <= 30 ? 'warn' : '');
  el.textContent = fmt(ms);
}
function fmt(ms){
  const s = Math.ceil(ms/1000);
  return Math.floor(s/60) + ':' + String(s%60).padStart(2,'0');
}
setInterval(paintTimer, 250);

const isK = r => typeof r === 'string' && r[0] === 'K';
const esc = s => String(s==null?'':s).replace(/[&<>"']/g,
  m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));

function lastClass(s){
  const n = (s||'').length;
  return n>=18?' L18' : n>=16?' L16' : n>=14?' L14' : n>=12?' L12' : n>=10?' L10' : '';
}

async function poll(){
  try{
    const r = await fetch(API + '/draft/latest?t=' + Date.now(), {cache:'no-store'});
    if(!r.ok) throw new Error('HTTP ' + r.status);
    const j = await r.json();
    if(j.empty){ setDot('stale', 'NOT STARTED'); schedule(); return; }
    lastGood = Date.now();
    const h = JSON.stringify(j.state);
    if(h !== lastHash){ lastHash = h; draw(j.state, j.published_at); }
    else { freshness(j.published_at); }
    setDot('on', 'LIVE');
  }catch(e){
    setDot('bad', 'OFFLINE');
    $('fRight').textContent = 'Trying to reconnect…';
  }
  schedule();
}

function schedule(){
  clearTimeout(timer);
  timer = setTimeout(poll, document.hidden ? SLOW_MS : POLL_MS);
}

function setDot(cls, txt){
  const d = $('dot');
  d.className = cls; d.textContent = txt;
  d.title = cls === 'on'   ? 'Connected. This page refreshes itself.' :
            cls === 'bad'  ? 'Cannot reach the draft right now. Still trying.' :
                             'Connected, but no picks have come through recently.';
}

function freshness(published){
  if(!published) return;
  const age = Date.now() - new Date(published).getTime();
  $('fRight').textContent = 'Last pick ' + ago(age) + ' ago';
  if(age > STALE_MS && $('dot').className === 'on') setDot('stale', 'PAUSED');
}

function ago(ms){
  const s = Math.max(0, Math.round(ms/1000));
  if(s < 60) return s + 's';
  const m = Math.round(s/60);
  return m < 60 ? m + ' min' : Math.round(m/60) + ' hr';
}

function draw(st, published){
  $('msg').classList.add('hide');
  tInfo = st.timer || null;
  paintTimer();

  const NT = st.teams.length;
  const short = st.short || st.teams;
  const KR = Array.from({length: st.nkeepers || 4}, (_, i) => 'K' + i);
  const rows = KR.concat(Array.from({length: st.rounds}, (_, i) => i + 1));
  const oc = st.onclock;

  // clock
  if(oc){
    $('cRd').textContent  = isK(oc.r) ? 'Keeper ' + (+String(oc.r).slice(1) + 1)
                                      : 'Round ' + oc.r + (oc.pick ? '  ·  Pick ' + oc.pick : '');
    $('cWho').textContent = st.teams[oc.t] || '';
  }else{
    $('cRd').textContent = ''; $('cWho').textContent = 'DRAFT COMPLETE';
  }

  let made = 0;
  for(const k in st.cells) if(st.cells[k].l) made++;
  $('fLeft').textContent = made + ' players on the board';

  let h = '<table class="board"><thead><tr><th class="corner"></th>';
  for(let t=0;t<NT;t++)
    h += '<th class="team" title="' + esc(st.teams[t]) + '"><div class="tname">' +
         esc(short[t]) + '</div><div class="tgrade">' + esc((st.grades||[])[t] || '') + '</div></th>';
  h += '</tr></thead><tbody>';

  for(const r of rows){
    const kr = isK(r);
    const cls = kr ? ' class="krow"' : (r === 1 ? ' class="firstround"' : '');
    h += '<tr' + cls + '><td class="rd' + (kr?' rdk':'') + '">' +
         (kr ? 'K' + (+String(r).slice(1) + 1) : r) + '</td>';
    for(let t=0;t<NT;t++){
      const key = r + '-' + t;
      const c   = st.cells[key];
      const on  = oc && String(oc.r) === String(r) && oc.t === t;
      h += '<td class="cell' + (kr?' kcell':'') + (on?' onclock':'') +
           (c && c.x ? ' xed':'') + '">';
      if(c && c.l){
        const pos = ['RB','WR','QB','TE','DST'].includes(c.p) ? c.p : 'UNK';
        // glow only for cells that are new since the last redraw
        const isNew = !firstPaint && !prevCells[key];
        const byeTxt = c.b ? (kr ? String(c.b) : 'BYE ' + c.b) : '';
        h += '<div class="stk p' + pos + (kr?' keeper':'') + (isNew?' fresh':'') + '">' +
             '<div class="top"><span class="first">' + esc(c.f) + '</span>' +
             '<span class="meta"><b>' + esc(c.t) + '</b>' +
             (byeTxt ? ' <span class="bye">' + byeTxt + '</span>' : '') + '</span>' +
             (kr ? '<span class="kflag">KEEP</span>' : '') + '</div>' +
             '<div class="last' + lastClass(c.l) + '">' + esc(c.l) + '</div></div>';
      }else if(c && c.tr){
        h += '<div class="stk trade"><div class="top"><span class="first">Traded to</span></div>' +
             '<div class="last' + lastClass(c.tr) + '">' + esc(c.tr) + '</div></div>';
      }
      h += '</td>';
    }
    h += '</tr>';
  }
  $('board').innerHTML = h + '</tbody></table>';

  prevCells = {};
  for(const k in st.cells) if(st.cells[k].l) prevCells[k] = 1;
  firstPaint = false;

  fit(rows.length, st.nkeepers || 4, st.rounds, NT);
  freshness(published);
}

/* Same fit logic as the board: size everything so the whole grid lands on screen. */
function fit(nRows, nk, nrounds, NT){
  const wrap = $('wrap');
  const GAP = 3, RDCOL = 34, KROW = 0.78, TU = 14*1.15 + 25*1.05;
  const availW = wrap.clientWidth  - 26;
  const availH = wrap.clientHeight - 18;
  if(availW < 100 || availH < 100) return;

  let w = Math.max(64, Math.min(340, (availW - RDCOL - GAP*(NT+1)) / NT));
  const units = nk*KROW + nrounds + 1.3;
  let hh = Math.max(26, Math.min(140, (availH - GAP*(nRows+2)) / units));
  let sc = Math.max(0.45, Math.min(2.4, Math.min(w/150, hh/52)));
  sc = Math.max(0.45, Math.min(sc, (hh - 6) / TU));

  const R = document.documentElement.style;
  R.setProperty('--cellw',  Math.round(w) + 'px');
  R.setProperty('--cellh',  Math.round(hh) + 'px');
  R.setProperty('--cellhk', Math.round(hh * KROW) + 'px');
  R.setProperty('--scale',  Math.round(sc*1000)/1000);

  requestAnimationFrame(()=>{
    const tbl = wrap.querySelector('table.board'); if(!tbl) return;
    const cw = wrap.clientWidth - 6, ch = wrap.clientHeight - 6;
    if(tbl.offsetWidth > cw || tbl.offsetHeight > ch){
      const k = Math.min(cw/tbl.offsetWidth, ch/tbl.offsetHeight);
      R.setProperty('--cellw',  Math.round(w*k) + 'px');
      R.setProperty('--cellh',  Math.round(hh*k) + 'px');
      R.setProperty('--cellhk', Math.round(hh*k*KROW) + 'px');
      R.setProperty('--scale',  Math.round(sc*k*1000)/1000);
    }
  });
}

let rz = null;
window.addEventListener('resize', ()=>{ clearTimeout(rz); rz = setTimeout(()=>{ lastHash=''; poll(); }, 150); });
document.addEventListener('visibilitychange', ()=>{ if(!document.hidden){ clearTimeout(timer); poll(); } });

poll();
</script>
</body>
</html>
